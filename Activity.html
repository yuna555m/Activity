<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نشاط تفاعلي: صنّف البنود</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div dir="rtl" style="width: 1440px; height: 1220px; box-sizing: border-box; padding: 64px; display: flex; flex-direction: column; gap: 28px; background: #F3F5F7; color: #0F1F33; font-family: Calibri, 'Tajawal', system-ui, sans-serif">

<div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 32px; height: 120px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="align-self: flex-start; padding: 6px 22px; background: #0F1F33; color: #FFFFFF; font-size: 22px; font-weight: 700; border-radius: 999px">نشاط مصغر · ١٠ دقائق</div>
<h1 style="margin: 0; font-size: 56px; line-height: 68px; font-weight: 800; color: #0F1F33">نشاط تفاعلي: صنّف البنود</h1>
</div>
<div style="display: flex; flex-direction: row; align-items: center; gap: 20px; box-sizing: border-box; height: 96px; padding: 0 24px; background: #FFFFFF; border: 1px solid #D3DAE2; border-radius: 20px">
<span dir="ltr" style="min-width: 150px; text-align: center; font-size: 56px; line-height: 64px; font-weight: 800; color: {{timeColor}}">{{timeText}}</span>
<button type="button" onClick="{{startToggle}}" style="width: 128px; height: 52px; border: none; border-radius: 14px; background: #0F1F33; color: #FFFFFF; font-family: inherit; font-size: 22px; font-weight: 800; cursor: pointer">{{startLabel}}</button>
<button type="button" onClick="{{resetTimer}}" style="width: 100px; height: 52px; box-sizing: border-box; border: 2px solid #0F1F33; border-radius: 14px; background: #FFFFFF; color: #0F1F33; font-family: inherit; font-size: 22px; font-weight: 800; cursor: pointer">إعادة</button>
</div>
</div>

<div style="display: flex; flex-direction: row; align-items: center; gap: 28px; box-sizing: border-box; height: 124px; padding: 16px 40px; background: #0F1F33; border-radius: 20px">
<div style="flex-shrink: 0; padding: 8px 24px; background: #8CCABD; color: #0F1F33; font-size: 26px; font-weight: 800; border-radius: 999px">سؤال جماعي</div>
<div style="flex: 1; min-width: 0; font-size: 34px; line-height: 46px; font-weight: 800; color: #FFFFFF">صنّف البنود التالية: هل تنتمي لأمن المعلومات أم الأمن السيبراني؟</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<div style="flex: 1; min-height: 0; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 24px; padding: 20px 28px; background: #FFFFFF; border: 1px solid #D3DAE2; border-radius: 18px">
<div style="flex-shrink: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: #E3EEF7; border-radius: 50%; font-size: 28px; font-weight: 800; color: #1F5A8A">{{row.n}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 30px; line-height: 40px; font-weight: 800; color: #0F1F33">{{row.text}}</div>
<sc-if value="{{row.showFeedback}}" hint-placeholder-val="{{false}}">
<div style="{{row.feedbackStyle}}">{{row.feedback}}</div>
</sc-if>
</div>
<div style="flex-shrink: 0; display: flex; flex-direction: row; gap: 12px">
<sc-for list="{{row.choices}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 24px; height: 64px">
<div style="font-size: 24px; line-height: 32px; font-weight: 500; color: #3E4F61">{{summary}}</div>
<div style="display: flex; flex-direction: row; gap: 16px">
<button type="button" onClick="{{toggleReveal}}" style="height: 56px; padding: 0 32px; border: none; border-radius: 14px; background: #0F1F33; color: #FFFFFF; font-family: inherit; font-size: 24px; font-weight: 800; cursor: pointer">{{revealLabel}}</button>
<button type="button" onClick="{{resetAll}}" style="height: 56px; box-sizing: border-box; padding: 0 32px; border: 2px solid #0F1F33; border-radius: 14px; background: #FFFFFF; color: #0F1F33; font-family: inherit; font-size: 24px; font-weight: 800; cursor: pointer">إعادة النشاط</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1220}}'>
class Component extends DCLogic {
componentDidMount() {
this._tick = setInterval(() => {
const s = this.state || {};
if (!s.running) return;
const left = s.secs === undefined ? 600 : s.secs;
if (left <= 1) { this.setState({ secs: 0, running: false }); }
else { this.setState({ secs: left - 1 }); }
}, 1000);
}
componentWillUnmount() {
clearInterval(this._tick);
}
renderVals() {
const s = this.state || {};
const picks = s.picks || {};
const revealed = !!s.revealed;
const running = !!s.running;
const secs = s.secs === undefined ? 600 : s.secs;
const digits = '٠١٢٣٤٥٦٧٨٩';
const ar = (n) => String(n).replace(/[0-9]/g, (d) => digits[Number(d)]);
const OPTS = [
{ id: 'info', label: 'أمن المعلومات', color: '#1F5A8A' },
{ id: 'cyber', label: 'الأمن السيبراني', color: '#0B5D52' },
{ id: 'both', label: 'كلاهما', color: '#0F1F33' }
];
const ITEMS = [
{ text: 'خزانة ملفات ورقية مقفلة', ans: 'info', ansLabel: 'أمن معلومات (فيزيائي)', exp: 'الورق خارج نطاق الأمن السيبراني.' },
{ text: 'جدار حماية شبكة', ans: 'cyber', ansLabel: 'أمن سيبراني', exp: 'يحمي الشبكة من الهجمات الرقمية.' },
{ text: 'سياسة كلمات المرور', ans: 'both', ansLabel: 'كلاهما', exp: 'تحمي المعلومات والأنظمة الرقمية معاً.' },
{ text: 'تشفير قرص صلب', ans: 'both', ansLabel: 'كلاهما', exp: 'يحمي البيانات الرقمية المخزّنة.' }
];
const base = 'box-sizing: border-box; width: 214px; height: 64px; padding: 0 8px; border-radius: 14px; font-family: inherit; font-size: 22px; line-height: 28px; font-weight: 800; cursor: pointer; ';
let answered = 0;
let correct = 0;
const rows = ITEMS.map((it, i) => {
const pick = picks[i];
const has = pick !== undefined;
if (has) { answered += 1; if (pick === it.ans) correct += 1; }
const showFeedback = has || revealed;
let feedback = '';
let fcolor = '#0F1F33';
if (has && pick === it.ans) { feedback = '✓ صحيح: ' + it.ansLabel + '. ' + it.exp; fcolor = '#0F5B33'; }
else if (has) { feedback = '✗ الإجابة الصحيحة: ' + it.ansLabel + '. ' + it.exp; fcolor = '#8A1C16'; }
else if (revealed) { feedback = 'الإجابة: ' + it.ansLabel + '. ' + it.exp; }
const choices = OPTS.map((o) => {
let style;
let label = o.label;
if (has && pick === o.id && pick === it.ans) {
style = base + 'background: #DDF0E4; border: 2px solid #1B7F4B; color: #0F5B33';
label = '✓ ' + o.label;
} else if (has && pick === o.id) {
style = base + 'background: #FBE4E1; border: 2px solid #B3261E; color: #8A1C16';
label = '✗ ' + o.label;
} else if (showFeedback && o.id === it.ans) {
style = base + 'background: #FFFFFF; border: 2px dashed #1B7F4B; color: #0F5B33';
label = '✓ ' + o.label;
} else if (showFeedback) {
style = base + 'background: #FFFFFF; border: 2px solid #C5D0DB; color: #5B6B7C';
} else {
style = base + 'background: #FFFFFF; border: 2px solid ' + o.color + '; color: ' + o.color;
}
return { label, style, pick: () => {
const cur = Object.assign({}, (this.state && this.state.picks) || {});
cur[i] = o.id;
this.setState({ picks: cur });
} };
});
return {
n: ar(i + 1),
text: it.text,
showFeedback,
feedback,
feedbackStyle: 'font-size: 22px; line-height: 32px; font-weight: 500; color: ' + fcolor,
choices
};
});
const mm = Math.floor(secs / 60);
const ss = secs % 60;
const timeText = ar(String(mm).padStart(2, '0') + ':' + String(ss).padStart(2, '0'));
const startLabel = running ? 'إيقاف مؤقت' : (secs === 600 ? 'ابدأ' : (secs === 0 ? 'من جديد' : 'استئناف'));
return {
rows,
timeText,
timeColor: secs <= 60 ? '#B3261E' : '#0F1F33',
startLabel,
startToggle: () => {
const cs = this.state || {};
const left = cs.secs === undefined ? 600 : cs.secs;
if (left === 0) { this.setState({ secs: 600, running: true }); }
else { this.setState({ running: !cs.running }); }
},
resetTimer: () => this.setState({ secs: 600, running: false }),
summary: answered === 0 ? 'اختر تصنيفاً لكل بند لتظهر الإجابة' : 'أُجيب عن ' + ar(answered) + ' من ' + ar(ITEMS.length) + ' — الصحيح: ' + ar(correct),
revealLabel: revealed ? 'إخفاء الإجابات' : 'إظهار الإجابات',
toggleReveal: () => this.setState({ revealed: !(this.state && this.state.revealed) }),
resetAll: () => this.setState({ picks: {}, revealed: false, secs: 600, running: false })
};
}
}
</script>
</body>
</html>
